<!DOCTYPE html>
<html>

<head>

    <title>Sistema de Fila</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>

        /* RESET */

        * {
            box-sizing: border-box;
        }

        body {

            font-family: Arial, sans-serif;

            background: #0f172a;

            margin: 0;
            padding: 15px;

            display: flex;
            justify-content: center;
            align-items: flex-start;

        }

        /* CONTAINER */

        .container {

            width: 100%;
            max-width: 500px;

            background: white;

            border-radius: 16px;

            padding: 20px;

            box-shadow: 0 0 20px rgba(0,0,0,0.2);

        }

        /* TÍTULO */

        h1 {

            text-align: center;

            margin-bottom: 10px;

        }

        /* PAINEL */

        .painel {

            background: #111827;

            color: white;

            border-radius: 14px;

            padding: 20px;

            margin-bottom: 15px;

        }

        .chamando {

            text-align: center;

            font-size: 18px;

            opacity: 0.7;

        }

        /* SENHA */

        .senha-gigante {

            text-align: center;

            font-size: 64px;

            font-weight: bold;

            margin-top: 10px;

            color: white;

            transition: 0.3s;

        }

        /* GUICHÊ */

        .guiche {

            text-align: center;

            font-size: 22px;

            font-weight: bold;

            margin-top: 8px;

            color: #60a5fa;

        }

        /* SELECT */

        select {

            width: 100%;

            padding: 12px;

            margin: 8px 0;

            border-radius: 10px;

            font-size: 16px;

        }

        /* BOTÕES */

        button {

            width: 100%;

            padding: 15px;

            margin: 8px 0;

            border: none;

            border-radius: 12px;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

        }

        .normal {
            background-color: #3b82f6;
            color: white;
        }

        .prioridade {
            background-color: #f97316;
            color: white;
        }

        .chamar {
            background-color: #22c55e;
            color: white;
        }

        /* MENSAGEM */

        .mensagem {

            margin-top: 10px;

            padding: 12px;

            border-radius: 10px;

            background-color: #22c55e;

            color: white;

            font-weight: bold;

            display: none;

        }

        /* FILAS */

        .filas {

            margin-top: 20px;

        }

        .fila-box {

            background: #f1f5f9;

            padding: 12px;

            border-radius: 10px;

            margin-bottom: 10px;

            font-size: 14px;

        }

        /* RESPONSIVO */

        @media (max-width: 400px) {

            .senha-gigante {
                font-size: 48px;
            }

        }

        @media (min-width: 768px) {

            .senha-gigante {
                font-size: 90px;
            }

        }

        /* 🔥 ANIMAÇÃO AMARELA PROFISSIONAL */

        @keyframes destaqueAmarelo {

            0% {
                color: white;
                text-shadow: none;
            }

            50% {
                color: yellow;
                text-shadow: 0 0 25px yellow;
                transform: scale(1.1);
            }

            100% {
                color: white;
                text-shadow: none;
                transform: scale(1);
            }

        }

        .destaque {

            animation: destaqueAmarelo 0.8s ease-in-out 4;

        }

    </style>

</head>

<body>

<div class="container">

    <h1>Sistema de Fila</h1>

    <div class="painel">

        <div class="chamando">
            Chamando senha
        </div>

        <div class="senha-gigante" id="senha">
            ---
        </div>

        <div class="guiche" id="guichePainel">
            Guichê 1
        </div>

    </div>

    <div id="mensagem" class="mensagem"></div>

    <label><strong>Guichê:</strong></label>

    <select id="guiche">

        <option value="1">Guichê 1</option>
        <option value="2">Guichê 2</option>
        <option value="3">Guichê 3</option>

    </select>

    <button class="normal" onclick="gerarNormal()">
        Gerar Normal
    </button>

    <button class="prioridade" onclick="gerarPrioridade()">
        Gerar Prioridade
    </button>

    <button class="chamar" onclick="chamar()">
        Chamar Próxima
    </button>

    <div class="filas">

        <p><strong>Fila Normal:</strong></p>

        <div class="fila-box" id="filaNormal">
            ---
        </div>

        <p><strong>Fila Prioridade:</strong></p>

        <div class="fila-box" id="filaPrioridade">
            ---
        </div>

    </div>

</div>

<script>

    /* GERAR NORMAL */

    function gerarNormal() {

        fetch("/gerarNormal", {
            method: "POST"
        })
            .then(response => response.text())
            .then(data => {

                mostrarMensagem(
                    "Senha gerada: " + data
                );

                atualizarFilas();

            });

    }

    /* GERAR PRIORIDADE */

    function gerarPrioridade() {

        fetch("/gerarPrioridade", {
            method: "POST"
        })
            .then(response => response.text())
            .then(data => {

                mostrarMensagem(
                    "Senha PRIORITÁRIA: " + data
                );

                atualizarFilas();

            });

    }

    /* CHAMAR */

    function chamar() {

        let guicheSelecionado =
            document.getElementById("guiche").value;

        fetch("/chamar", {
            method: "POST"
        })
            .then(response => response.text())
            .then(data => {

                if (data === "" || data === "---" || data === "Nenhuma senha") {

                    mostrarMensagem(
                        "Ainda não há senhas na fila"
                    );

                    return;

                }

                /* MOSTRA SENHA */

                document.getElementById("senha").innerText = data;

                document.getElementById("guichePainel").innerText =
                    "Guichê " + guicheSelecionado;

                /* SOM + VOZ */

                tocarSom();

                /* PISCAR */

                piscarSenha();

                /* ATUALIZA FILAS */

                atualizarFilas();

            });

    }

    /* MENSAGEM */

    function mostrarMensagem(texto) {

        let msg =
            document.getElementById("mensagem");

        msg.innerText = texto;

        msg.style.display = "block";

        setTimeout(() => {

            msg.style.display = "none";

        }, 3000);

    }

    /* 🔊 SOM + VOZ */

    /* SOM PROFISSIONAL */

    let audioChamada = new Audio(
        "https://actions.google.com/sounds/v1/alarms/bugle_tune.ogg"
    );

    /* pré-carrega o áudio */
    audioChamada.preload = "auto";

    function tocarSom() {

        audioChamada.currentTime = 0;

        audioChamada.volume = 0.9;

        audioChamada.play();

    }

    /* 🟡 PISCAR AMARELO */

    function piscarSenha() {

        let senha =
            document.getElementById("senha");

        senha.classList.add("destaque");

        setTimeout(() => {

            senha.classList.remove("destaque");

        }, 3200);

    }

    /* ATUALIZAR FILAS */

    function atualizarFilas() {

        fetch("/filaNormal")
            .then(response => response.text())
            .then(data => {

                document.getElementById("filaNormal").innerText = data;

            });

        fetch("/filaPrioridade")
            .then(response => response.text())
            .then(data => {

                document.getElementById("filaPrioridade").innerText = data;

            });

    }

    /* AUTO ATUALIZA */

    setInterval(atualizarFilas, 3000);

    window.onload = function() {

        atualizarFilas();

    };

</script>

</body>

</html>
